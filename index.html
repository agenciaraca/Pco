      A Inter saiu daqui em 31/ago/2026.

      O site público é servido em system-ui, com zero webfont de propósito — sem

      é explícito em como resolver — as duas metades em system-ui. De quebra,
      sai um request de terceiro do caminho crítico de toda tela do aluno.

      A pilha vive em `tailwind.config.js` e é igual à de `server/public/styles.ts`.
