name: Deploy to VPS

# Auto-deploy no push para main.
#
# Autenticação por CHAVE, não por senha (desde 30/ago/2026). A troca não foi
# preferência: os secrets guardados apontavam para `srv1621737`, uma máquina que
# tem uma cópia do repositório e nenhum processo da app. Durante três semanas o
# deploy "passou" — pull e build rodavam, produção ficava parada e o push seguia
# verde. Senha e host errados vinham em par, e acertar só um não resolvia.
#
# Requer secrets: VPS_SSH_KEY (chave privada), VPS_HOST, VPS_USER.
# Opcionais: VPS_PORT (default 22), PUBLIC_URL.

# **O deploy espera o CI.**
#
# Até 3/set/2026 este workflow disparava em `push: branches: [main]`, sem
# `needs` e sem `workflow_run` — e o `ci.yml` disparava no MESMO push, em
# paralelo. O CI só bloqueava *pull request*: um push direto para `main` com
# typecheck quebrado, lint sujo, teste vermelho ou E2E reprovado **subia para
# produção do mesmo jeito**. Todas as guardas da suíte eram opcionais na
# prática, e ninguém saberia — porque o deploy também ficava verde.
#
# `workflow_run` espera o CI terminar e só segue quando ele conclui com
# sucesso. `workflow_dispatch` continua permitindo o deploy manual deliberado,
# que é a válvula para quando se precisa subir sabendo do risco.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: # permite trigger manual, ignorando o gate acima

# Não roda 2 deploys ao mesmo tempo (concurrency lock)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + Build + Restart no VPS
    runs-on: ubuntu-latest
    # Só sobe se o CI passou. No `workflow_dispatch` não há `workflow_run`, e
    # a segunda condição libera o disparo manual.
    if: >-
      github.repository_owner == 'agenciaraca' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara a chave SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "✗ Secret VPS_SSH_KEY não definido."
            echo "  Gere/instale a chave no servidor e rode:"
            echo "    gh secret set VPS_SSH_KEY --repo <owner>/<repo> < caminho/da/chave"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH (pull + build + restart)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "✗ Secrets VPS_HOST / VPS_USER não definidos."
            exit 1
          fi
          PORT=${PORT:-22}
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              -p "$PORT" "$USER@$HOST" bash -s <<'EOF'
          set -eu
          APP_DIR=/home/avapco/ava-pco
          export PM2_HOME=/home/avapco/.pm2
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" || true
          echo "conectado em $(hostname) como $(whoami)"

          # Esta é a máquina de produção mesmo?
          #
          # A pergunta existe porque a falha silenciosa já aconteceu (ver o
          # cabeçalho). Produção é quem tem o processo PM2 da app; qualquer
          # outra máquina pode ter o repositório e enganar o pull e o build.
          if ! pm2 describe ava-pco > /dev/null 2>&1; then
            echo "✗ Não existe processo PM2 'ava-pco' nesta máquina ($(hostname))."
            echo "  O deploy está indo para o servidor errado — confira o secret VPS_HOST."
            echo "  PM2 encontrado aqui:"
            pm2 list || true
            exit 1
          fi

          cd "$APP_DIR"
          # repo de outro dono: git recusa sem essa exceção
          git config --global --add safe.directory "$APP_DIR" || true
          # package-lock modificado no servidor faz o pull abortar
          git checkout -- package-lock.json 2>/dev/null || true
          # Guarda a configuração de produção ANTES do reset.
          #
          # Quatro arquivos de `data/` são versionados de propósito (padrão de
          # instalação nova: nome da escola, texto da tela de login, horário
          # dos dois relatórios) e são, todos, editáveis em tela. Como
          # `git reset --hard` reverte arquivo versionado, sem isto tudo que o
          # admin ajustou em /admin/settings voltava ao padrão a cada deploy —
          # sem erro e sem aviso.
          #
          # Este workflow, ao contrário do `scripts/deploy_producao.sh`, não
          # fazia backup nenhum antes do reset: aqui a perda era definitiva.
          CFG=$(mktemp -d)
          for f in settings login-config admin-weekly-config student-progress-email-config; do
            [ -f "data/$f.json" ] && cp "data/$f.json" "$CFG/" || true
          done

          git fetch --all -q
          git reset --hard origin/main

          for f in settings login-config admin-weekly-config student-progress-email-config; do
            if [ -f "$CFG/$f.json" ]; then
              cp "$CFG/$f.json" "data/$f.json"
              echo "  configuração de produção preservada: data/$f.json"
            fi
          done
          rm -rf "$CFG"

          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          pm2 restart ava-pco --update-env
          sleep 5
          curl -s -m 8 http://127.0.0.1:3035/api/health || (pm2 logs ava-pco --lines 30 --nostream && exit 1)
          echo "✓ Deploy concluído em $(hostname): $(git log --oneline -1)"
          EOF

      - name: Remove a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Verifica health público
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          URL="${PUBLIC_URL:-https://ava.psicanaliseclinica.online}"
          for i in 1 2 3; do
            if curl -fs -m 8 "$URL/api/health" > /dev/null; then
              echo "✓ Health público OK em $URL"
              exit 0
            fi
            echo "tentativa $i falhou, retry em 5s..."
            sleep 5
          done
          echo "✗ Health público falhou após 3 tentativas"
          exit 1

      # O bundle é o que prova que o código novo subiu: /api/health responde 200
      # mesmo com código velho, porque o processo antigo continua saudável.
      # Aqui só registramos o hash no log — comparar com o build local não cabe,
      # este job não constrói nada.
      - name: Registra o bundle publicado
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          URL="${PUBLIC_URL:-https://ava.psicanaliseclinica.online}"
          # `-L` obrigatório: /login responde 301, e sem seguir o
          # redirecionamento o grep nunca casa — o passo imprimia
          # "<não encontrado>" sempre, sem afetar o código de saída. Um passo de
          # verificação que, por construção, não verificava nada.
          NO_AR=$(curl -sL -m 10 "$URL/login" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "bundle no ar: ${NO_AR:-<não encontrado>}"
