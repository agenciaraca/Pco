name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # NÃO há passo de `format:check` aqui, e isso é decisão, não esquecimento.
      #
      # O script existe no `package.json` e o CLAUDE.md o descreve como "CI
      # dry-run" — mas **684 arquivos do repositório não passam nele hoje**.
      # Ligá-lo agora reprovaria o build no primeiro push, e a única forma de
      # destravar seria um `prettier --write` no repo inteiro: um diff de
      # milhares de linhas que enterraria qualquer mudança de verdade junto.
      #
      # Ligar isto é um commit próprio, e nesta ordem: formatar tudo sozinho,
      # commitar só a formatação, e só então acrescentar o passo aqui.
      - name: Test
        run: npm run test

      # Sem `continue-on-error`. O passo não tinha como reprovar nada de
      # qualquer forma (não há threshold), mas o `continue-on-error` também
      # escondia falha do próprio vitest — coverage quebrado passava por verde.
      - name: Test coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: build
    # Passa a bloquear o merge (26/ago/2026).
    #
    # Enquanto foi informativo, escondeu que metade da suíte NUNCA rodou: um
    # teste comparava número com `true` e não tinha como passar; o helper de
    # login gravava o token cru, que nenhuma tela sabe ler; a suíte estourava o
    # limite de 5 logins/minuto sozinha; e um teste navegava para uma rota
    # inexistente, medindo a página de 404. Verde por não ser olhado é pior do
    # que vermelho.
    #
    # Se voltar a falhar por flakiness e não por regressão, o certo é consertar
    # o teste — não devolver o cobertor.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E (chromium)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
