<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sem conexão — AVA PCO</title>
    <link rel="icon" type="image/png" href="/icone-pco.png" />
    <style>
      :root {
        --bg: #f4f8fa;
        --card: #ffffff;
        --ink: #0f2937;
        --muted: #6b7c8c;
        --accent: #0097b2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .box {
        max-width: 480px;
        background: var(--card);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        text-align: center;
      }
      img { width: 56px; height: 56px; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 8px 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
      .small { font-size: 12px; color: var(--muted); margin-top: 24px; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icone-pco.png" alt="AVA PCO" />
      <h1>Sem conexão</h1>
      <p>
        Não foi possível alcançar o AVA PCO. Verifique sua internet ou tente novamente em
        instantes.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <p class="small">
        Suas anotações offline serão sincronizadas quando a conexão voltar.
      </p>
    </div>
  </body>
</html>
